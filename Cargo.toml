[package]
name = "aiu-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Windows-first, cross-platform Claude and Codex account usage monitor"
license = "MIT"
repository = "https://github.com/krflol/aiu-rs"
default-run = "aiu"

[lib]
name = "aiu"
path = "src/lib.rs"

[[bin]]
name = "aiu"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:eframe"]
screenshot = ["desktop", "dep:image"]

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
ctrlc = "3"
dirs = "6"
eframe = { version = "0.33", optional = true, default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
fs2 = "0.4"
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
unicode-normalization = "0.1"
url = "2"
webbrowser = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tiny_http = "0.12"

[profile.release]
lto = "thin"
strip = true
