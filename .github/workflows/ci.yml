name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --locked --all-targets --all-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo check --locked --no-default-features
      - run: cargo run --locked -- --fixture fixtures/demo.json --json
  build:
    name: Release binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgtk-3-dev libayatana-appindicator3-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.88.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: cp target/release/aiu "aiu-${{ runner.os }}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/aiu.exe "aiu-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: aiu-${{ runner.os }}
          path: aiu-*
