name: Release tag
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  version-and-build:
    name: Validate tag and build artifacts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, windows-latest, macos-latest] }
    steps:
      - uses: actions/checkout@v4
      - name: Validate Cargo version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version" || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libxkbcommon-dev libwayland-dev libegl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: 1.88.0 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package Unix binary
        if: runner.os != 'Windows'
        run: cp target/release/aiu "aiu-${{ runner.os }}"
      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Copy-Item target/release/aiu.exe "aiu-Windows.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: aiu-${{ runner.os }}-${{ github.ref_name }}
          path: aiu-*
