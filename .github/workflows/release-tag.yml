name: Release tag

# A tag that disagrees with VERSION in the Makefile ships a binary that reports the wrong
# version, and `aiu update` then either nags about an upgrade that is already installed
# or never notices the release. `make tag` derives the tag from VERSION so it cannot
# happen there; this catches a tag made by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  version:
    name: Tag matches VERSION
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          version="$(sed -n 's/^VERSION[[:space:]]*?=[[:space:]]*//p' Makefile)"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but the Makefile says VERSION=$version — delete the tag, fix whichever is wrong, and tag again with \`make tag\`"
            exit 1
          fi
          echo "$GITHUB_REF_NAME matches VERSION=$version"
