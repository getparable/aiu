name: Release CLI archives

# The maintainer still creates the release and publishes the signed macOS app.
# Attach CLI artifacts only after that release exists, avoiding a race with
# `make tag` and leaving release notes/Homebrew ownership unchanged.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Native CLI tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...

  upload:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^VERSION[[:space:]]*?=[[:space:]]*//p' Makefile)"
          test "$RELEASE_TAG" = "v$version"
      - run: python3 scripts/package-cli.py --output dist
      - name: Verify checksums
        working-directory: dist
        run: sha256sum --check *-checksums.txt
      - name: Attach CLI archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
